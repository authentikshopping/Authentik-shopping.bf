<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Authentik Shopping</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:#f5f5f5;color:#222}
header{background:#111;color:#fff;padding:12px;position:sticky;top:0;z-index:1000}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:55px;height:55px;object-fit:contain;border-radius:8px;background:#fff;padding:2px}
.logo h1{font-size:18px}
.logo p{font-size:10px;color:#ddd}
.logo p span{color:#2E7D32;font-weight:bold}
.cart{position:relative;cursor:pointer;font-size:24px}
#cartCount{position:absolute;top:-8px;right:-8px;background:#e53935;color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.search{display:flex;background:#fff;border-radius:30px;overflow:hidden}
.search input{flex:1;padding:12px;border:none;outline:none}
.search button{background:#2E7D32;color:#fff;border:none;padding:0 18px}
.banner{margin:12px;background:linear-gradient(135deg,#111,#2E7D32);color:#fff;border-radius:18px;padding:20px;text-align:center}
.banner h2{margin-bottom:8px}
.categories{display:flex;gap:10px;overflow:auto;padding:12px}
.cat{min-width:82px;background:#fff;padding:10px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;transition:0.2s}
.cat:hover, .cat.active{background:#2E7D32;color:#fff}
.section{padding:12px 15px;font-size:22px;font-weight:bold}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 15px 20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover}
.info{padding:10px;text-align:center}
.old{text-decoration:line-through;color:#999;font-size:13px}
.price{font-size:18px;color:#2E7D32;font-weight:bold;margin:5px 0}
button{cursor:pointer}
.add{width:100%;padding:9px;background:#111;color:#fff;border:none;border-radius:8px;margin-top:8px}
footer{background:#111;color:#bbb;text-align:center;padding:22px;margin-top:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:flex-end;z-index:2000}
.modal.active{display:flex}
.sheet{background:#fff;width:100%;max-width:500px;border-radius:22px 22px 0 0;padding:18px;max-height:85vh;overflow:auto}
.cart-item{display:flex;gap:10px;margin:12px 0}
.cart-item img{width:70px;height:70px;border-radius:10px}
.qty{display:flex;align-items:center;gap:8px;margin-top:5px}
.qty button{width:28px;height:28px;border:none;background:#eee;border-radius:50%}
.total{font-size:20px;font-weight:bold;color:#2E7D32;margin:15px 0}
.checkout{width:100%;padding:14px;background:#25D366;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:bold}
.close{float:right;font-size:24px;cursor:pointer}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo">
<img src="IMG_3729JPEG" alt="Authentik Shopping">
<div>
<h1>Authentik Shopping</h1>
<p>Toujours au bon endroit, <span>Moins cher.</span></p>
</div>
</div>

<div class="cart" onclick="openCart()">
🛒
<div id="cartCount">0</div>
</div>
</div>

<div class="search">
<input id="searchInput" placeholder="Rechercher un produit..." onkeyup="searchProducts()">
<button>🔍</button>
</div>
</header>

<div class="banner">
<h2>🔥 Nouveautés & Promotions</h2>
<p>Livraison rapide partout au Burkina Faso 🇧🇫</p>
</div>

<div class="categories">
<div class="cat active" onclick="filtrerCategorie('tous', this)">🏠<br>Tous</div>
<div class="cat" onclick="filtrerCategorie('homme', this)">👕<br>Homme</div>
<div class="cat" onclick="filtrerCategorie('femme', this)">👗<br>Femme</div>
<div class="cat" onclick="filtrerCategorie('chaussures', this)">👟<br>Chaussures</div>
<div class="cat" onclick="filtrerCategorie('accessories', this)">🧢<br>Accessoires</div>
<div class="cat" onclick="filtrerCategorie('autres', this)">✨<br>Autres</div>
</div>

<div class="section" id="sectionTitle">Nos Produits</div>

<div class="products" id="products"></div>

<footer>
📱 WhatsApp : +226 51 91 88 47
</footer>

<div class="modal" id="cartModal">
<div class="sheet">
<div class="close" onclick="closeCart()">✕</div>
<h2>Votre panier</h2>

<div id="cartItems"></div>

<div class="total" id="totalPrice">Total : 0 FCFA</div>

<button class="checkout" onclick="checkout()">
Commander sur WhatsApp
</button>
</div>
</div>

<script>
const produits=[
{id:1,nom:"Bonnet Streetwear",prix:5000,ancien:6250,cat:"accessories",img:"https://IMG_3973JPEG/400?text=Bonnet"},
{id:2,nom:"Robe Élégante",prix:12000,ancien:15000,cat:"femme",img:"https://IMG_3978JPEG/400?text=Robe+Femme"},
{id:3,nom:"Sac Premium",prix:18000,ancien:22000,cat:"sacs",img:"https://IMG_3975JPEG/400?text=Sac"},
{id:4,nom:"Sneakers Sport",prix:25000,ancien:30000,cat:"chaussures",img:"https://IMG_3976JPEG/400?text=Sneakers"},
{id:5,nom:"Chemise Homme",prix:10000,ancien:13000,cat:"homme",img:"https://IMG_3977JPEG/400?text=Chemise+Homme"},
{id:6,nom:"Gadget Divers",prix:3000,ancien:4000,cat:"autres",img:"https://IMG_3974JPEG/400?text=Autre"}
];

let panier=JSON.parse(localStorage.getItem("panier"))||[];
let categorieActuelle = "tous";

function save(){
localStorage.setItem("panier",JSON.stringify(panier));
}

function renderProducts(liste){
const zone=document.getElementById("products");
zone.innerHTML="";
if(liste.length === 0){
zone.innerHTML = "<p style='grid-column: span 2; text-align:center; color:#777; padding:20px;'>Aucun produit trouvé dans cette catégorie.</p>";
return;
}
liste.forEach(p=>{
zone.innerHTML+=`
<div class="card" data-nom="${p.nom.toLowerCase()}">
<img src="${p.img}">
<div class="info">
<h3>${p.nom}</h3>
<div class="old">${p.ancien.toLocaleString()} FCFA</div>
<div class="price">${p.prix.toLocaleString()} FCFA</div>
<button class="add" onclick="add(${p.id})">Ajouter au panier</button>
</div>
</div>`;
});
}

function filtrerCategorie(cat, el){
categorieActuelle = cat;
document.querySelectorAll(".categories .cat").forEach(c => c.classList.remove("active"));
el.classList.add("active");

if(cat === 'tous'){
renderProducts(produits);
} else {
letFiltre = produits.filter(p => p.cat === cat);
renderProducts(letFiltre);
}
// Réinitialiser la barre de recherche lors du changement de catégorie
document.getElementById("searchInput").value = "";
}

function add(id){
let item=panier.find(i=>i.id===id);
if(item){
item.qte++;
}else{
const p=produits.find(x=>x.id===id);
panier.push({...p,qte:1});
}
save();
updateCart();
}

function updateCart(){
let nb=panier.reduce((a,b)=>a+b.qte,0);
document.getElementById("cartCount").innerText=nb;

let html="";
let total=0;

panier.forEach(p=>{
total+=p.prix*p.qte;
html+=`
<div class="cart-item">
<img src="${p.img}">
<div style="flex:1">
<b>${p.nom}</b><br>
${p.prix.toLocaleString()} FCFA
<div class="qty">
<button onclick="moins(${p.id})">-</button>
${p.qte}
<button onclick="plus(${p.id})">+</button>
<button onclick="supprimer(${p.id})">🗑️</button>
</div>
</div>
</div>`;
});

if(html===""){
html="<p>Votre panier est vide.</p>";
}

document.getElementById("cartItems").innerHTML=html;
document.getElementById("totalPrice").innerText="Total : "+total.toLocaleString()+" FCFA";
}

function plus(id){
panier.find(i=>i.id===id).qte++;
save();
updateCart();
}

function moins(id){
let item=panier.find(i=>i.id===id);
item.qte--;
if(item.qte<=0){
panier=panier.filter(i=>i.id!==id);
}
save();
updateCart();
}

function supprimer(id){
panier=panier.filter(i=>i.id!==id);
save();
updateCart();
}

function openCart(){
document.getElementById("cartModal").classList.add("active");
}

function closeCart(){
document.getElementById("cartModal").classList.remove("active");
}

function checkout(){
if(panier.length===0){
alert("Votre panier est vide.");
return;
}

let total=0;
let texte="Bonjour Authentik Shopping 👋%0A%0A";
texte+="Je souhaite passer la commande suivante :%0A%0A";

const numero="AS-"+Date.now().toString().slice(-6);
texte+="🛒 Commande "+numero+"%0A%0A";

panier.forEach((p,i)=>{
const sous=p.prix*p.qte;
total+=sous;
texte+=(i+1)+". "+p.nom+" ×"+p.qte+" — "+sous.toLocaleString()+" FCFA%0A";
});

texte+="%0A💰 Total : "+total.toLocaleString()+" FCFA%0A%0A";
texte+="📍 Je vous envoie ma localisation juste après ce message.%0A";
texte+="Merci de m'envoyer les informations de paiement.";

window.open("https://wa.me/22651918847?text="+texte,"_blank");
}

function searchProducts(){
let valeur=document.getElementById("searchInput").value.toLowerCase();
// Filtrer d'abord par rapport à la catégorie active sélectionnée
let source = (categorieActuelle === 'tous') ? produits : produits.filter(p => p.cat === categorieActuelle);
let resultat = source.filter(p => p.nom.toLowerCase().includes(valeur));
renderProducts(resultat);
}

// Initialisation au chargement
renderProducts(produits);
updateCart();
</script>

</body>
</html>
