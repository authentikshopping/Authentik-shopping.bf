<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentik Shopping</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5;color:#111}
header{
background:linear-gradient(90deg,#d00000,#0a8f3c);
padding:15px;color:white;position:sticky;top:0;z-index:1000}
header h1{text-align:center}
header p{text-align:center;font-size:13px}

.search{
padding:10px;background:white}
.search input{
width:100%;padding:12px;border-radius:25px;border:1px solid #ccc}

.categories{
display:flex;overflow:auto;background:white;padding:10px;gap:10px}
.categories button{
border:none;background:#fff;padding:10px 15px;border-radius:20px;
box-shadow:0 2px 5px rgba(0,0,0,.1);cursor:pointer}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;padding:15px}

.card{
background:white;border-radius:15px;padding:10px;
box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{
width:100%;height:150px;object-fit:cover;border-radius:10px}
.card h3{font-size:16px;margin-top:8px}
.price{color:#d00000;font-weight:bold;margin:5px 0}
.card button{
width:100%;background:#0a8f3c;color:white;border:none;
padding:10px;border-radius:10px;cursor:pointer}

.cart-btn{
position:fixed;bottom:20px;right:20px;
background:#d00000;color:white;border:none;
padding:15px;border-radius:50%;font-size:20px}

.cart{
position:fixed;top:0;right:-100%;width:320px;height:100%;
background:white;transition:.3s;padding:15px;
box-shadow:-5px 0 15px rgba(0,0,0,.2);overflow:auto}
.cart.open{right:0}

.cart-item{
display:flex;gap:10px;margin-bottom:15px}
.cart-item img{
width:60px;height:60px;border-radius:10px;object-fit:cover}
.qty button{
width:25px;height:25px;border:none;background:#eee;border-radius:5px}

.total{
font-size:20px;font-weight:bold;margin:15px 0}
input{
width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
.whatsapp{
background:#25D366;color:white;width:100%;padding:12px;
border:none;border-radius:10px;font-size:16px}
</style>
</head>

<body>

<header>
<h1>🛍️ Authentik Shopping</h1>
<p>Toujours au bon endroit, moins cher.</p>
</header>

<div class="search">
<input type="text" id="search" placeholder="Rechercher un produit...">
</div>

<div class="categories">
<button onclick="filterProducts('all')">Tous</button>
<button onclick="filterProducts('homme')">👨 Hommes</button>
<button onclick="filterProducts('femme')">👩 Femmes</button>
<button onclick="filterProducts('accessoire')">🎒 Accessoires</button>
<button onclick="filterProducts('autre')">📦 Autres</button>
</div>

<div class="products" id="products"></div>

<button class="cart-btn" onclick="toggleCart()">🛒</button>

<div class="cart" id="cart">
<h2>Votre panier</h2>
<div id="cartItems"></div>

<div class="total" id="total">Total : 0 FCFA</div>

<input id="nom" placeholder="Votre nom">
<input id="tel" placeholder="Téléphone">

<button class="whatsapp" onclick="commander()">Commander sur WhatsApp</button>
</div>

<script>

const phone="22670000000"; // Remplace par ton numéro

const products=[
{id:1,name:"Montre Homme",price:12000,cat:"homme",img:"images/montre.jpg"},
{id:2,name:"Sac Femme",price:8500,cat:"femme",img:"images/sac.jpg"},
{id:3,name:"Écouteurs",price:6000,cat:"accessoire",img:"images/ecouteurs.jpg"},
{id:4,name:"Lampe LED",price:4500,cat:"autre",img:"images/lampe.jpg"}
];

let cart=[];

function display(list){
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<div class="price">${p.price.toLocaleString()} FCFA</div>
<button onclick="add(${p.id})">Ajouter</button>
</div>`).join("");
}

display(products);

function filterProducts(cat){
if(cat=="all") display(products);
else display(products.filter(p=>p.cat==cat));
}

document.getElementById("search").addEventListener("input",e=>{
let t=e.target.value.toLowerCase();
display(products.filter(p=>p.name.toLowerCase().includes(t)));
});

function add(id){
let item=cart.find(x=>x.id==id);
if(item)item.qty++;
else{
let p=products.find(x=>x.id==id);
cart.push({...p,qty:1});
}
renderCart();
}

function change(id,n){
let item=cart.find(x=>x.id==id);
item.qty+=n;
if(item.qty<=0)cart=cart.filter(x=>x.id!=id);
renderCart();
}

function renderCart(){
document.getElementById("cartItems").innerHTML=cart.map(i=>`
<div class="cart-item">
<img src="${i.img}">
<div>
<b>${i.name}</b><br>
${i.price.toLocaleString()} FCFA<br>
<div class="qty">
<button onclick="change(${i.id},-1)">-</button>
${i.qty}
<button onclick="change(${i.id},1)">+</button>
</div>
</div>
</div>`).join("");

let total=cart.reduce((a,b)=>a+b.price*b.qty,0);
document.getElementById("total").innerHTML="Total : "+total.toLocaleString()+" FCFA";
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function commander(){

if(cart.length==0)return alert("Panier vide");

let nom=document.getElementById("nom").value;
let tel=document.getElementById("tel").value;

let texte=`🛍️ *Commande Authentik Shopping*%0A%0A`;
texte+=`👤 Nom : ${nom}%0A📞 ${tel}%0A%0A`;

cart.forEach((i,n)=>{
texte+=`${n+1}. ${i.name} x${i.qty} - ${(i.price*i.qty).toLocaleString()} FCFA%0A📸 ${location.origin}/${i.img}%0A%0A`;
});

let total=cart.reduce((a,b)=>a+b.price*b.qty,0);
texte+=`💰 Total : ${total.toLocaleString()} FCFA%0A%0A`;

const envoyer=(loc)=>{
window.open(`https://wa.me/${phone}?text=${texte}📍 ${loc}`,"_blank");
};

navigator.geolocation.getCurrentPosition(
pos=>{
envoyer(`https://maps.google.com/?q=${pos.coords.latitude},${pos.coords.longitude}`);
},
()=>{
envoyer("Le client enverra sa localisation sur WhatsApp.");
}
);

}

</script>

</body>
</html>
