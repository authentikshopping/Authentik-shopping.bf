<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentik Shopping</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="top-bar">
        <span><i class="fa-solid fa-truck"></i> Livraison partout au Burkina Faso</span>
        <span><i class="fa-solid fa-lock"></i> Paiement à la livraison</span>
        <span><i class="fa-brands fa-whatsapp"></i> Service client WhatsApp</span>
    </div>

    <header class="main-header">
        <div class="menu-icon"><i class="fa-solid fa-bars"></i></div>
        
        <div class="logo">
            <span class="logo-as">AS</span>
            <span class="logo-text">AUTHENTIK <strong>SHOPPING</strong></span>
            <i class="fa-solid fa-cart-shopping cart-icon-logo"></i>
        </div>

        <div class="header-icons">
            <i class="fa-regular fa-heart"></i>
            <i class="fa-regular fa-user"></i>
            <div class="cart-container">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="badge">2</span>
            </div>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Rechercher un produit, une catégorie...">
            <button class="search-btn">Rechercher</button>
        </div>
    </div>

    <div class="categories-carousel">
        <div class="cat-item">
            <div class="cat-circle red-border"><i class="fa-solid fa-grid"></i></div>
            <span>Toutes</span>
        </div>
        <div class="cat-item">
            <div class="cat-circle"><img src="homme.png" alt="Hommes"></div>
            <span>Hommes</span>
        </div>
        <div class="cat-item">
            <div class="cat-circle"><img src="femme.png" alt="Femmes"></div>
            <span>Femmes</span>
        </div>
        <div class="cat-item">
            <div class="cat-circle"><img src="sac.png" alt="Accessoires"></div>
            <span>Accessoires</span>
        </div>
        <div class="cat-item">
            <div class="cat-circle"><img src="chaussure.png" alt="Chaussures"></div>
            <span>Chaussures</span>
        </div>
        <div class="cat-item">
            <div class="cat-circle"><i class="fa-solid fa-ellipsis"></i></div>
            <span>Autres</span>
        </div>
    </div>

</body>
</html>
